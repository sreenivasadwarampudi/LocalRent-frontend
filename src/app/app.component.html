<header class="topbar">
  <a class="brand" routerLink="/search" (click)="closeMenu()">
    <img src="logo.png" alt="LocalRent Logo" class="brand-logo" />
    <span class="brand-text">LocalRent</span>
  </a>

  <!-- Mobile Hamburger Toggle Button -->
  <button type="button" class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle navigation">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <!-- Navigation & User Actions Container -->
  <div class="nav-container" [class.open]="isMenuOpen()">
    <nav>
      <a routerLink="/search" routerLinkActive="active" (click)="closeMenu()">Find rentals</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About LocalRent</a>
      @if (auth.isOwner()) {
        <a routerLink="/my-listings" routerLinkActive="active" (click)="closeMenu()">My listings</a>
        <a routerLink="/listings/new" routerLinkActive="active" (click)="closeMenu()">Post rental</a>
      }
    </nav>

    <div class="account">
      @if (auth.isLoggedIn()) {
        <span class="who">{{ auth.user()?.name }}</span>
        <button type="button" class="link" (click)="logout()">Logout</button>
      } @else {
        <a routerLink="/login" (click)="closeMenu()">Owner login</a>
        <a class="cta" routerLink="/signup" (click)="closeMenu()">List your rental</a>
      }
    </div>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>
