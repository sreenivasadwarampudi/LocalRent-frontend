<header class="topbar">
  <a class="brand" routerLink="/search">
    <img src="logo.png" alt="LocalRent Logo" class="brand-logo" />
    <span class="brand-text">LocalRent</span>
  </a>

  <nav>
    <a routerLink="/search" routerLinkActive="active">Find rentals</a>
    <a routerLink="/about" routerLinkActive="active">About LocalRent</a> <!-- Added tab -->
    @if (auth.isOwner()) {
      <a routerLink="/my-listings" routerLinkActive="active">My listings</a>
      <a routerLink="/listings/new" routerLinkActive="active">Post rental</a>
    }
  </nav>

  <div class="account">
    @if (auth.isLoggedIn()) {
      <span class="who">{{ auth.user()?.name }}</span>
      <button type="button" class="link" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login">Owner login</a>
      <a class="cta" routerLink="/signup">List your rental</a>
    }
  </div>
</header>

<main class="page">
  <router-outlet />
</main>
