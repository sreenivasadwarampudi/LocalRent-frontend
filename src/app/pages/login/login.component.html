<div class="card" style="max-width: 420px; margin: 0 auto;">
  <h1>Owner log in</h1>
  <p class="hint">Only rental owners need an account. Searching is open to everyone.</p>

  <button 
    type="button" 
    class="google-btn" 
    (click)="loginWithGoogle()"
    [disabled]="loading()"
    style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; background: white; font-weight: 500; cursor: pointer;">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958l3.007 2.332z"/>
    </svg>
    Log in with Google
  </button>
  
  <div class="divider" style="display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: #888;">
    <span style="flex: 1; border-bottom: 1px solid #e0e0e0;"></span>
    <span style="padding: 0 10px; font-size: 0.85rem;">OR</span>
    <span style="flex: 1; border-bottom: 1px solid #e0e0e0;"></span>
  </div>


  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="phone">Mobile number</label>
      <input id="phone" type="tel" inputmode="tel" formControlName="phone" placeholder="9876543210" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
    </div>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Logging in...' : 'Log in' }}
    </button>
  </form>

  <p class="hint" style="margin-top: 1rem;">Want to rent out your vehicle or equipment? <a routerLink="/signup">Create an owner account with Mobile Number</a></p>

</div>
