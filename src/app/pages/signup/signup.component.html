<div class="card" style="max-width: 460px; margin: 0 auto;">
  <h1>List your rental</h1>
  <p class="hint">
    An account is only needed to post rentals. Browsing and searching stay free and open to everyone.
  </p>

  <!-- Mobile Sign-Up Form -->
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" formControlName="name" />
    </div>

    <div class="field">
      <label for="phone">Mobile number</label>
      <input id="phone" type="tel" inputmode="tel" formControlName="phone" placeholder="9876543210" />
      <span class="hint">You will use this number to log in. Renters call you on it.</span>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
      <span class="hint">At least 6 characters</span>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button class="btn" type="submit" [disabled]="loading() || form.invalid">
      {{ loading() ? 'Creating...' : 'Create owner account' }}
    </button>
  </form>
  
  <p class="hint" style="margin-top: 1rem;">Already registered? <a routerLink="/login">Log in</a></p>
</div>
